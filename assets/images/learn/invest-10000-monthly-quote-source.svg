<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">How to invest ten thousand rupees per month quote</title>
  <description id="description">Ten thousand rupees is the budget. Your goal, timeline and capacity for loss determine the plan.</description>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="31" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feBlend in="SourceGraphic" in2="mono" mode="soft-light" />
    </filter>
    <pattern id="stitches" width="94" height="94" patternUnits="userSpaceOnUse">
      <path d="M47 11v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" />
      <path d="M0 58v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" />
      <path d="M94 58v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#063d33" />
  <rect width="1200" height="630" fill="#063d33" filter="url(#paper-grain)" opacity="0.2" />
  <rect x="803" y="0" width="397" height="630" fill="url(#stitches)" opacity="0.9" />

  <text x="58" y="142" fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">“</text>
  <g fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="54">
    <text x="108" y="174">₹10,000 is the budget.</text>
    <text x="108" y="246">Your goal, timeline and</text>
    <text x="108" y="318">capacity for loss</text>
    <text x="108" y="390">determine the plan.</text>
  </g>
  <text x="648" y="390" fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">”</text>
  <text x="108" y="466" fill="#e3a72f" font-family="Arial, Helvetica, sans-serif" font-size="30">— Roz Invest</text>
</svg>
