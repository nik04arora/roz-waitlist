<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">SIP versus mutual fund quote</title>
  <description id="description">A mutual fund is what you invest in. An SIP is one way you invest in it.</description>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="23" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feBlend in="SourceGraphic" in2="mono" mode="soft-light" />
    </filter>
    <pattern id="stitches" width="94" height="94" patternUnits="userSpaceOnUse">
      <path d="M47 11v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" />
      <path d="M0 58v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" />
      <path d="M94 58v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" />
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="#063d33" />
  <rect width="1200" height="1200" fill="#063d33" filter="url(#paper-grain)" opacity="0.2" />
  <rect x="803" y="0" width="397" height="1200" fill="url(#stitches)" opacity="0.9" />

  <text x="58" y="494" fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">“</text>
  <g fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="54">
    <text x="108" y="525">A mutual fund is what you</text>
    <text x="108" y="597">invest in. An SIP is one way</text>
    <text x="108" y="669">you invest in it.</text>
  </g>
  <text x="708" y="669" fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">”</text>
  <text x="108" y="742" fill="#e3a72f" font-family="Arial, Helvetica, sans-serif" font-size="30">— Roz Invest</text>
</svg>
