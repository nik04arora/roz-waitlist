<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">What is a mutual fund quote</title>
  <description id="description">A mutual fund pools your money. The scheme decides where it goes and what risks you take.</description>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="27" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feBlend in="SourceGraphic" in2="mono" mode="soft-light" />
    </filter>
    <pattern id="stitches" width="94" height="94" patternUnits="userSpaceOnUse">
      <path d="M47 11v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" />
      <path d="M0 58v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" />
      <path d="M94 58v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#063d33" />
  <rect width="1200" height="630" fill="#063d33" filter="url(#paper-grain)" opacity="0.2" />
  <rect x="803" y="0" width="397" height="630" fill="url(#stitches)" opacity="0.9" />

  <text x="58" y="174" fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">“</text>
  <g fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="58">
    <text x="108" y="205">A mutual fund pools</text>
    <text x="108" y="281">your money. The scheme</text>
    <text x="108" y="357">decides where it goes—</text>
    <text x="108" y="433">and what risks you take.</text>
  </g>
  <text x="744" y="432" fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">”</text>
  <text x="108" y="498" fill="#e3a72f" font-family="Arial, Helvetica, sans-serif" font-size="30">— Roz Invest</text>
</svg>
