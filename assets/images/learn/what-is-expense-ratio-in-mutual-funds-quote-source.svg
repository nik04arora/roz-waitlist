<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Mutual fund expense ratio quote</title>
  <description id="description">An expense ratio does not arrive as a bill. It is already working inside the fund's NAV.</description>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="121" result="noise" /><feColorMatrix in="noise" type="saturate" values="0" result="mono" /><feBlend in="SourceGraphic" in2="mono" mode="soft-light" /></filter>
    <pattern id="stitches" width="94" height="94" patternUnits="userSpaceOnUse"><path d="M47 11v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" /><path d="M0 58v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" /><path d="M94 58v16" fill="none" stroke="#e3a72f" stroke-width="4" stroke-linecap="round" /></pattern>
  </defs>
  <rect width="1200" height="630" fill="#063d33" /><rect width="1200" height="630" fill="#063d33" filter="url(#paper-grain)" opacity="0.2" /><rect x="803" width="397" height="630" fill="url(#stitches)" opacity="0.9" />
  <text x="58" y="105" fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700">“</text>
  <g fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="43"><text x="108" y="145">An expense ratio does not arrive</text><text x="108" y="209">as a bill. It is already working</text><text x="108" y="273">inside the fund's NAV.</text></g>
  <text x="577" y="273" fill="#fdf3dc" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700">”</text><text x="108" y="421" fill="#e3a72f" font-family="Arial, Helvetica, sans-serif" font-size="30">— Roz Invest</text>
</svg>
